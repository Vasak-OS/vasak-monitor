limpieza:
  midiendo: Measuring what can be reclaimed…
  totalEtiqueta: Reclaimable space
  enDisco: On disk
  enMemoria: In memory
  limpiar: Clean
  limpiarConClave: Clean…
  limpiarTodo: Clean all
  hecho: Done
  advertenciaMemoria: >-
    Almost everything that promises to «free memory» on Linux frees nothing: what
    looks occupied is disk cache, and the system gives it back on its own when
    something asks. Emptying it forces re-reading from disk what was already in
    memory, so things get slower afterwards, not faster. These two do something
    measurable, and say what.
  tareas:
    cache-de-usuario:
      titulo: Application cache
      detalle: Data each program regenerates when it needs it.
    papelera:
      titulo: Trash
      detalle: What was deleted and can still be recovered.
    cache-de-paquetes:
      titulo: Downloaded packages
      detalle: The latest version of each is kept, so you can roll back.
    paquetes-huerfanos:
      titulo: Orphan packages
      detalle: Left installed with nothing needing them.
    diario-viejo:
      titulo: System journal
      detalle: The last seven days are kept.
    swap-a-la-memoria:
      titulo: Bring swap back to memory
      detalle: Pages left on disk return to RAM. Useful when memory is free and swap is occupied.
    cache-del-kernel:
      titulo: Empty the disk cache
      detalle: Leaves the system «cold». Useful to measure something from scratch, not as an improvement.
registros:
  soloProblemas: Errors only
  buscar: Search the messages
  cuantas: "{0} entries"
  deQuien: Application
  todoElEcosistema: The whole ecosystem
  todoElSistema: The whole system
  sinEntradas: no entries
  nadaQueMostrar: This application has written nothing to the journal since the system booted.
  dondeEscriben: >-
    Services write under their own name. An application opened from the menu writes
    to the desktop session's journal instead, so its messages show up there and not
    here.
